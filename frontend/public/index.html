<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the layout reach under a notch; the safe-area
       insets in App.css then keep the chrome clear of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon.svg" />
  <meta name="description" content="HomeAPI — a self-hosted key-value store with a REST API and web GUI." />
  <!-- Replaced by src/theme.js once it runs; these are what the browser has to
       go on for the very first paint. -->
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
  <title>HomeAPI</title>
  <script>
    // Resolve the theme before the first paint, so a dark-mode machine never
    // gets a white flash while the bundle loads. Kept deliberately tiny and
    // dependency-free; src/theme.js owns everything after hydration and reads
    // the same key. Any failure just leaves the CSS media-query fallback.
    (function () {
      try {
        var saved = window.localStorage.getItem('homeapi.theme');
        var pref = saved === 'light' || saved === 'dark' ? saved : null;
        var dark = pref ? pref === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* fall through to the media query in index.css */ }
    })();
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
