<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1f2933"/>

  <!-- Roof, drawn first so the card below tucks under its eaves -->
  <path d="M92 242 L256 104 L420 242" fill="none" stroke="#4ECDC4" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The store itself: a card holding key/value rows -->
  <rect x="140" y="238" width="232" height="176" rx="28" fill="#f5f7f7"/>
  <g>
    <!-- key -->
    <rect x="172" y="280" width="26" height="26" rx="8" fill="#4ECDC4"/>
    <!-- value -->
    <line x1="216" y1="293" x2="340" y2="293" stroke="#c2d0cf" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="172" y="346" width="26" height="26" rx="8" fill="#4ECDC4"/>
    <line x1="216" y1="359" x2="300" y2="359" stroke="#c2d0cf" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
