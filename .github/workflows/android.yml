name: HomeAPI (Android app)

# Builds the phone app and runs its tests whenever it changes, or anything it
# packages does: in full-stack mode the APK carries the homeapi server itself,
# built from cmd/ and internal/ with the web GUI embedded, so a change to the
# server or the frontend is a change to the app.

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "cmd/**"
      - "internal/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "cmd/**"
      - "internal/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The server inside the APK embeds the web GUI, which the Gradle build
      # makes with `make frontend`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The Go side the app depends on — what it starts the server with
      # (serve), the zone it hands it (hostenv), the discovery it answers
      # (discovery) — and the icons it carries, derived from icon.svg.
      - name: Go tests the app relies on
        working-directory: .
        run: go test -count=1 ./internal/serve/ ./internal/hostenv/ ./internal/discovery/ ./cmd/homeapi-icons/

      # Everything the app decides, as plain JVM tests.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      # The runner image ships the Android SDK; ANDROID_HOME points at it.
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease

      # An APK without the server builds fine and then has no full-stack
      # mode at all, so its absence fails the build. So does a server built
      # without the web GUI in it, or one that is not a static binary.
      - name: Check the server is in the APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libhomeapi.so" || { echo "no libhomeapi.so for arm64-v8a in $apk" >&2; exit 1; }
          unzip -l "$apk" | grep -q "assets/homeapi-bridge.js" || { echo "no page bridge in $apk" >&2; exit 1; }
          so=app/build/generated/homeapiServer/jniLibs/arm64-v8a/libhomeapi.so
          file "$so" | grep -q "ARM aarch64.*statically linked" || { file "$so"; echo "libhomeapi.so is not a static arm64 binary" >&2; exit 1; }
          grep -q 'id="root"' ../../cmd/homeapi/frontend_build/index.html || { echo "the embedded web GUI is not a real build" >&2; exit 1; }
          echo "libhomeapi.so present for arm64-v8a, static, with the web GUI embedded"

      - uses: actions/upload-artifact@v4
        with:
          name: homeapi-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
